<footer class="site-footer">
  <div class="site-footer__inner">
    <!-- Marca: logo + nombre -->
    <div class="site-footer__brand">
      <a routerLink="/" class="site-footer__logo-link" aria-label="Jhoel Blanco — inicio">
        <img
          class="site-footer__logo"
          [src]="brandMarkSrc()"
          width="48"
          height="48"
          alt=""
          decoding="async"
        />
      </a>

      <div class="site-footer__identity">
        <p class="site-footer__name">Jhoel Blanco</p>
        <p class="site-footer__role" i18n="@@footer.role">Frontend Engineer</p>
      </div>
    </div>

    <!-- Descargas CV -->
    <div class="site-footer__cv">
      <p class="site-footer__label">{{ cvLabel }}</p>
      <div class="site-footer__cv-links">
        <a class="cv-btn" href="assets/cv/Jhoel_Blanco_CV_ES_L.pdf" download>{{ cvEs }}</a>
        <a class="cv-btn" href="assets/cv/Jhoel_Blanco_CV_EN_L.pdf" download>{{ cvEn }}</a>
      </div>
    </div>

    <!-- Nav + redes -->
    <nav class="site-footer__nav" aria-label="Footer">
      <a routerLink="/sobre-mi">{{ about }}</a>
      <a routerLink="/contacto">{{ contact }}</a>
      <a href="mailto:jhoel10blanco@gmail.com">Email</a>
      <a href="https://wa.me/584126168206" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a href="https://www.linkedin.com/in/jhoelblanco" target="_blank" rel="noopener noreferrer"
        >LinkedIn</a
      >
      <a href="https://github.com/jhoelblancoo" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
  </div>

  <!-- Copyright + versión de deploy -->
  <p class="site-footer__copy">
    <span>© {{ year }} Jhoel Blanco</span>
    <span class="site-footer__version">v{{ version }}</span>
  </p>
</footer>
