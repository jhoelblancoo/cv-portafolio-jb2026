<section class="page contact">
  <header class="page__header">
    <p class="page__brand">Jhoel Blanco</p>
    <h1>{{ title }}</h1>
    <p class="page__lead">{{ lead }}</p>
  </header>

  <ul class="contact__list">
    <li>
      <a class="contact__link" [href]="'mailto:' + email">
        <span class="contact__label">{{ emailLabel }}</span>
        <span class="contact__value">{{ email }}</span>
      </a>
    </li>
    <li>
      <a class="contact__link" [href]="whatsappUrl" target="_blank" rel="noopener noreferrer">
        <span class="contact__label">{{ whatsappLabel }}</span>
        <span class="contact__value">+58 412-6168206</span>
      </a>
    </li>
    <li>
      <a class="contact__link" [href]="linkedinUrl" target="_blank" rel="noopener noreferrer">
        <span class="contact__label">{{ linkedinLabel }}</span>
        <span class="contact__value">linkedin.com/in/jhoelblanco</span>
      </a>
    </li>
    <li>
      <a class="contact__link" [href]="githubUrl" target="_blank" rel="noopener noreferrer">
        <span class="contact__label">{{ githubLabel }}</span>
        <span class="contact__value">github.com/jhoelblancoo</span>
      </a>
    </li>
  </ul>
</section>
