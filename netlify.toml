# Site: jhoelblanco.netlify.app
# GitHub repo is portfolio-only (this folder = site root).

[build]
  command = "npm run build"
  publish = "dist/portfolio/browser"

[build.environment]
  NODE_VERSION = "22"

# Required for @angular/ssr 22.x on Netlify
[[plugins]]
  package = "@netlify/angular-runtime"

# Locale entrypoints from @angular/localize baseHref
[[redirects]]
  from = "/"
  to = "/es/"
  status = 302

[[redirects]]
  from = "/es"
  to = "/es/"
  status = 301

[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

# SPA fallback within each locale (prerender covers Slice 1 routes; keep for client nav)
# Static files that exist (assets, prerendered HTML) take precedence over these.
[[redirects]]
  from = "/es/*"
  to = "/es/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/en/index.html"
  status = 200

# Site-root SEO files are written by scripts/seo-root.mjs after build.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/google3804d3f31e87917d.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=300"
